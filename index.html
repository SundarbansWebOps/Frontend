<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f2e8" />
    <title>Sundarbans House | IIT Madras BS</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="description"
      content="Official website of Sundarbans House, IIT Madras BS — events, resources, meetups, and certificate verification."
    />
    <meta property="og:title" content="Sundarbans House | IIT Madras BS" />
    <meta
      property="og:description"
      content="Official website of Sundarbans House, IIT Madras BS — events, resources, meetups, and certificate verification."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:image"
      content="https://res.cloudinary.com/l59gy0g2/image/upload/f_auto,q_auto:good,w_1000,c_limit/v1785911312/sundarbans/public/assets/og-preview.jpg"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="https://res.cloudinary.com/l59gy0g2/image/upload/f_auto,q_auto:good,w_1000,c_limit/v1785911312/sundarbans/public/assets/og-preview.jpg"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Anek Latin (Ek Type, Mumbai): variable width + weight, the house typeface. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Anek+Latin:wdth,wght@75..125,300..800&display=swap"
      rel="stylesheet"
    />
    <!-- Theme before first paint (same rule as src/lib/theme.js): saved choice, else system. -->
    <script>
      (() => {
        let t = null;
        try {
          t = localStorage.getItem('sundarbans-theme');
        } catch {
          /* storage blocked */
        }
        if (t !== 'light' && t !== 'dark')
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
        if (t === 'dark')
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#15120e');
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
