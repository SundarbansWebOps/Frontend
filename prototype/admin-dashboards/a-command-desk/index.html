<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Command Desk · Sundarbans Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anek+Latin:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f7f2e8;--card:#fffcf6;--sunk:#f1eadc;--ink:#1d1915;--ink-2:#584e43;--ink-3:#8a7e6e;
  --line:#e0d5c3;--line-2:#ebe3d4;--marigold:#f2a93b;--marigold-soft:#fbe9c9;--marigold-ink:#8f4a00;
  --vermilion:#b8341b;--vermilion-soft:#f7ddd4;--indigo:#2f4a7a;--indigo-soft:#e3e8f1;
  --on-marigold:#1d1915;--hover:rgba(29,25,21,.045);--sel:rgba(242,169,59,.16);
  --shadow:0 1px 0 rgba(29,25,21,.03),0 10px 30px -18px rgba(29,25,21,.35);
  --shadow-pop:0 18px 48px -12px rgba(29,25,21,.35),0 2px 6px rgba(29,25,21,.08);
  --banner-filter:none;--scrim:rgba(29,25,21,.35);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#15120e;--card:#1f1a15;--sunk:#19150f;--ink:#f3ebdd;--ink-2:#c7b9a4;--ink-3:#8f8271;
  --line:#2e271f;--line-2:#28221b;--marigold:#f2a93b;--marigold-soft:#3a2a13;--marigold-ink:#f4b85e;
  --vermilion:#e5653f;--vermilion-soft:#3b1d14;--indigo:#a9bde3;--indigo-soft:#1f2634;
  --hover:rgba(243,235,221,.05);--sel:rgba(242,169,59,.14);
  --shadow:0 1px 0 rgba(0,0,0,.2),0 10px 30px -18px rgba(0,0,0,.8);--shadow-pop:0 18px 48px -12px rgba(0,0,0,.8);
  --banner-filter:brightness(.62) saturate(.85) sepia(.15);--scrim:rgba(0,0,0,.6);color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#15120e;--card:#1f1a15;--sunk:#19150f;--ink:#f3ebdd;--ink-2:#c7b9a4;--ink-3:#8f8271;
  --line:#2e271f;--line-2:#28221b;--marigold:#f2a93b;--marigold-soft:#3a2a13;--marigold-ink:#f4b85e;
  --vermilion:#e5653f;--vermilion-soft:#3b1d14;--indigo:#a9bde3;--indigo-soft:#1f2634;
  --hover:rgba(243,235,221,.05);--sel:rgba(242,169,59,.14);
  --shadow:0 1px 0 rgba(0,0,0,.2),0 10px 30px -18px rgba(0,0,0,.8);--shadow-pop:0 18px 48px -12px rgba(0,0,0,.8);
  --banner-filter:brightness(.62) saturate(.85) sepia(.15);--scrim:rgba(0,0,0,.6);color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.45 "Anek Latin",system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--marigold-ink)}
.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.i.sm{width:15px;height:15px}
:focus-visible{outline:2px solid var(--marigold);outline-offset:2px;border-radius:6px}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:.86em;letter-spacing:-.01em}
.muted{color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh;background:linear-gradient(to right,var(--card) 235px,var(--line) 235px 236px,transparent 236px)}
.side{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;padding:16px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 16px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--marigold);color:var(--on-marigold);display:grid;place-items:center;font-weight:700;font-size:15px;letter-spacing:-.02em}
.brand b{display:block;font-size:15px;line-height:1.1}
.brand span{font-size:12px;color:var(--ink-3)}
.nav-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:16px 10px 6px;font-weight:600}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;color:var(--ink-2);text-decoration:none;font-weight:500;cursor:pointer}
.nav a:hover{background:var(--hover);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--sel);color:var(--ink)}
.nav a[aria-current="page"] .i{color:var(--marigold-ink)}
.nav .kbd{margin-left:auto}
.badge{margin-left:auto;min-width:22px;height:20px;border-radius:10px;background:var(--vermilion);color:#fff;font-size:12px;font-weight:600;display:grid;place-items:center;padding:0 6px}
.badge.quiet{background:var(--line);color:var(--ink-2)}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{padding:6px 4px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--ink-2);line-height:1.15}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.seg-cap{font-size:11px;color:var(--ink-3);margin:0 2px 6px;display:flex;justify-content:space-between}
.me{display:flex;align-items:center;gap:10px;margin-top:12px;padding:6px;border-radius:10px;width:100%;text-align:left}
.me:hover{background:var(--hover)}
.av{width:34px;height:34px;border-radius:50%;background:var(--marigold-soft) center/118% no-repeat;flex:none;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--marigold-ink);background-position:50% 18%}
.av.sm{width:26px;height:26px;font-size:10.5px}
.av.lg{width:56px;height:56px;font-size:18px}
.me b{display:block;font-size:13.5px;line-height:1.15}
.me span{font-size:12px;color:var(--ink-3)}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 28px;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.search{position:relative;flex:1;max-width:460px}
.search input{width:100%;height:38px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:0 74px 0 36px;outline:none}
.search input:focus{border-color:var(--marigold);box-shadow:0 0 0 3px var(--sel)}
.search>.i{position:absolute;left:11px;top:10px;color:var(--ink-3)}
.search .kbd{position:absolute;right:8px;top:8px}
.kbd{display:inline-flex;gap:3px;align-items:center;font-size:11px;color:var(--ink-3);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 5px;background:var(--card);font-weight:600;line-height:1.3;white-space:nowrap}
.suggest{position:absolute;left:0;right:0;top:44px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-pop);padding:6px;display:none;z-index:30}
.suggest.on{display:block}
.suggest button{display:flex;width:100%;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;text-align:left}
.suggest button:hover,.suggest button.hi{background:var(--hover)}
.suggest small{color:var(--ink-3);margin-left:auto;font-size:12px}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px 0 4px;border-radius:15px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600;white-space:nowrap}
.chip img{width:22px;height:22px;border-radius:50%}
.chip .dot{width:22px;height:22px;border-radius:50%;background:var(--marigold);display:grid;place-items:center;color:var(--on-marigold);font-size:11px}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--marigold);border-color:var(--marigold);color:var(--on-marigold)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.danger{background:var(--vermilion);border-color:var(--vermilion);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn.sm{height:30px;padding:0 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.ibtn{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--ink-2);border:1px solid transparent}
.ibtn:hover{background:var(--hover);color:var(--ink)}
.top .me-btn{padding:2px;border-radius:50%}
.content{padding:22px 28px 64px;max-width:1480px;width:100%}
.phead{display:flex;align-items:flex-end;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.phead h1{font-size:26px;line-height:1.1;margin:0;font-weight:700;letter-spacing:-.01em}
.phead p{margin:4px 0 0;color:var(--ink-3)}
.phead .spacer{min-width:8px}
.bnav{display:none}

/* ---------- cards / overview ---------- */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c7{grid-column:span 7}.c6{grid-column:span 6}.c5{grid-column:span 5}.c4{grid-column:span 4}.c3{grid-column:span 3}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-width:0;display:flex;flex-direction:column}
.card-h{display:flex;align-items:center;gap:8px;padding:14px 16px 10px}
.card-h h2{margin:0;font-size:15px;font-weight:700}
.card-h .count{color:var(--ink-3);font-weight:600;font-size:14px}
.card-h .link{margin-left:auto;font-size:13px;font-weight:600;color:var(--marigold-ink);display:inline-flex;align-items:center;gap:2px}
.card-h .link:hover{text-decoration:underline}
.card-b{padding:0 16px 14px;flex:1}
.hero{grid-column:span 12;overflow:hidden;padding:0}
.hero-art{position:relative;height:196px;background:url(../assets/banner.webp) center 58%/cover no-repeat}
.hero-art::before{content:"";position:absolute;inset:0;background:inherit;filter:var(--banner-filter)}
.hero-art::after{content:"";position:absolute;inset:auto 0 0 0;height:40%;background:linear-gradient(transparent,color-mix(in srgb,var(--card) 30%,transparent))}
.hero-text{position:absolute;z-index:1;left:clamp(16px,29%,420px);top:30px;max-width:42%}
.hero-text .eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6b3a06}
.hero-text h1{margin:4px 0 6px;font-size:30px;line-height:1.05;letter-spacing:-.015em;color:#1d1915}
.hero-text p{margin:0;color:#3b3127;font-size:15px}
:root[data-theme="dark"] .hero-text h1{color:#fbf4e7}:root[data-theme="dark"] .hero-text p{color:#eadcc4}:root[data-theme="dark"] .hero-text .eyebrow{color:#f4c27a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero-text h1{color:#fbf4e7}:root:not([data-theme="light"]) .hero-text p{color:#eadcc4}:root:not([data-theme="light"]) .hero-text .eyebrow{color:#f4c27a}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}
.kpi{padding:14px 18px;text-align:left;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.kpi:last-child{border-right:0}
.kpi:hover{background:var(--hover)}
.kpi .lab{font-size:13px;color:var(--ink-3);font-weight:500;display:flex;align-items:center;gap:6px}
.kpi .num{font-size:30px;font-weight:700;line-height:1.05;letter-spacing:-.02em}
.kpi .sub{font-size:12.5px;color:var(--ink-2)}
.kpi .up{color:var(--marigold-ink);font-weight:600}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--vermilion);box-shadow:0 0 0 0 var(--vermilion);animation:pulse 1.8s infinite;flex:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--vermilion) 60%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.live-dot{animation:none}*{transition:none!important}}

.tabs{display:inline-flex;max-width:100%;overflow-x:auto;scrollbar-width:none;background:var(--sunk);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px}
.tabs button{padding:4px 10px;border-radius:7px;font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.tabs button .n{color:var(--ink-3);margin-left:4px}

.rq{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 8px;border-radius:10px;border-top:1px solid var(--line-2);cursor:pointer}
.rq:first-child{border-top:0}
.rq:hover{background:var(--hover)}
.rq .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rq .m{font-size:13px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rq .acts{display:flex;gap:6px}
.kind{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:6px;font-size:11.5px;font-weight:700;letter-spacing:.02em;margin-right:6px;vertical-align:1px;background:var(--marigold-soft);color:var(--marigold-ink)}
.kind.transfer,.kind.assign{background:var(--indigo-soft);color:var(--indigo)}
.kind.remove{background:var(--vermilion-soft);color:var(--vermilion)}
.wait{font-size:12px;color:var(--indigo);font-weight:600;white-space:nowrap}
.emblem{width:30px;height:30px;border-radius:50%;flex:none}
.emblem.sm{width:20px;height:20px}
.emblem.lg{width:64px;height:64px}

.ev{display:flex;gap:12px;align-items:center;padding:9px 8px;border-radius:10px;cursor:pointer}
.ev:hover{background:var(--hover)}
.date{width:44px;flex:none;text-align:center;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--card)}
.date small{display:block;background:var(--marigold-soft);color:var(--marigold-ink);font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:1px 0}
.date b{display:block;font-size:18px;line-height:1.35}
.ev .t{font-weight:600;line-height:1.2}
.ev .m{font-size:12.5px;color:var(--ink-3)}
.live-card{border:1px solid color-mix(in srgb,var(--vermilion) 35%,var(--line));background:color-mix(in srgb,var(--vermilion-soft) 45%,var(--card));border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer}
.live-card .lv{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--vermilion);letter-spacing:.06em;text-transform:uppercase}
.live-card .t{font-weight:700;font-size:16px;margin:4px 0 2px;line-height:1.2}
.meter{height:6px;border-radius:3px;background:var(--line-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--marigold);border-radius:3px}
.meter.v i{background:var(--vermilion)}
.meter.n i{background:var(--indigo)}
.big{font-size:34px;font-weight:700;line-height:1;letter-spacing:-.02em}
.spark{display:flex;align-items:flex-end;gap:5px;height:46px;margin:12px 0 4px}
.spark i{flex:1;background:var(--marigold);border-radius:3px 3px 1px 1px;min-height:3px;opacity:.85}
.spark i:last-child{opacity:1;background:var(--marigold-ink)}
.spark-l{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3)}
.mini{display:flex;align-items:center;gap:9px;padding:6px 0;border-top:1px solid var(--line-2);font-size:13.5px;cursor:pointer}
.mini:hover .nm{text-decoration:underline}
.mini .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.mini small{color:var(--ink-3);white-space:nowrap}
.health{display:block;width:100%;text-align:left;padding:10px;border-radius:10px;border:1px solid var(--line-2);margin-bottom:8px}
.health:hover{border-color:var(--line);background:var(--hover)}
.health .row{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.health b{font-size:22px;line-height:1}
.health span{font-size:13px;color:var(--ink-2)}
.health small{margin-left:auto;font-size:12px;color:var(--ink-3)}
.list-i{display:block;width:100%;text-align:left;padding:8px 0;border-top:1px solid var(--line-2)}
.list-i:first-child{border-top:0}
.list-i .t{font-weight:600;font-size:14px;line-height:1.25}
.list-i .m{font-size:12.5px;color:var(--ink-3);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.list-i:hover .t{text-decoration:underline}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.tag.warn{background:var(--vermilion-soft);border-color:transparent;color:var(--vermilion)}
.tag.gold{background:var(--marigold-soft);border-color:transparent;color:var(--marigold-ink)}
.tag.blue{background:var(--indigo-soft);border-color:transparent;color:var(--indigo)}

.pulse-t{width:100%;border-collapse:collapse;font-size:13.5px}
.pulse-t th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600;text-align:right;padding:4px 8px 8px;white-space:nowrap}
.pulse-t th:first-child{text-align:left}
.pulse-t td{padding:6px 8px;border-top:1px solid var(--line-2);text-align:right;white-space:nowrap}
.pulse-t td:first-child{text-align:left}
.pulse-t tr.r{cursor:pointer}
.pulse-t tr.r:hover td{background:var(--hover)}
.rname{display:flex;align-items:center;gap:9px;font-weight:600}
.pct{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.pct .meter{width:72px}
.zero{color:var(--ink-3)}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line-2);font-size:13.5px}
.feed li:first-child{border-top:0}
.feed .when{font-size:12px;color:var(--ink-3)}
.feed b{font-weight:600}
.rc-region{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stat{background:var(--sunk);border:1px solid var(--line-2);border-radius:10px;padding:10px}
.stat b{display:block;font-size:20px}
.stat span{font-size:12px;color:var(--ink-3)}

/* ---------- empty ---------- */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:18px 16px 22px;gap:4px}
.empty img{width:150px;height:150px;object-fit:contain;margin-bottom:4px}
.empty b{font-size:17px}
.empty p{margin:0;color:var(--ink-3);max-width:340px;font-size:14px}

/* ---------- requests ---------- */
.rv{display:grid;grid-template-columns:380px minmax(0,1fr);gap:16px;align-items:start}
.rv-list{position:sticky;top:84px;max-height:calc(100vh - 110px);overflow:auto}
.rv-list .card-b{padding:6px}
.rli{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:10px;border:1px solid transparent;margin-bottom:2px}
.rli:hover{background:var(--hover)}
.rli[aria-current="true"]{background:var(--sel);border-color:color-mix(in srgb,var(--marigold) 45%,transparent)}
.rli .t{font-weight:600;display:flex;align-items:center;gap:4px;min-width:0}
.rli .t span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rli .m{font-size:12.5px;color:var(--ink-3);display:flex;gap:8px;margin-top:2px}
.rli .m .wait{margin-left:auto}
.rd{padding:20px 22px}
.rd-top{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.rd h2{margin:0;font-size:22px;line-height:1.15}
.rd .sub{color:var(--ink-3);font-size:13.5px;margin-top:4px}
.sec{margin-top:18px}
.sec h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin:0 0 8px;font-weight:600}
.who{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card);min-width:0}
.box .row{display:flex;gap:10px;align-items:center}
.box b{display:block;line-height:1.2}
.box small{color:var(--ink-3);font-size:12.5px;display:block;overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px;margin-top:10px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;overflow-wrap:anywhere}
.quote{border-left:3px solid var(--marigold);padding:8px 12px;background:var(--sunk);border-radius:0 10px 10px 0;margin:0;font-size:14.5px}
.diff{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:14px}
.diff th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600;padding:8px 12px;background:var(--sunk)}
.diff td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
.diff .before{color:var(--ink-3);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--vermilion) 60%,transparent)}
.diff .after{font-weight:600}
.diff .after mark{background:var(--marigold-soft);color:inherit;padding:0 3px;border-radius:4px}
.conseq{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--indigo-soft);color:var(--ink);font-size:14px}
.conseq .i{color:var(--indigo);margin-top:2px}
.conseq.warn{background:var(--vermilion-soft)}.conseq.warn .i{color:var(--vermilion)}
.tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line)}
.tl li{position:relative;padding:0 0 10px 10px;font-size:13.5px}
.tl li::before{content:"";position:absolute;left:-20px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--card);border:2px solid var(--marigold)}
.tl li small{color:var(--ink-3);display:block;font-size:12px}
.decide{position:sticky;bottom:0;margin:20px -22px -20px;padding:14px 22px;border-top:1px solid var(--line);background:var(--card);border-radius:0 0 14px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.decide .note{flex:1 1 220px;height:36px;border:1px solid var(--line);border-radius:9px;padding:0 12px;background:var(--paper);outline:none;min-width:0}
.decide .note:focus{border-color:var(--marigold)}
.decide .hint{font-size:12px;color:var(--ink-3);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.lock{display:flex;align-items:center;gap:8px;color:var(--indigo);font-weight:600;font-size:13.5px;flex:1 1 260px}
.outcome{display:flex;gap:8px;align-items:center;font-weight:600}
.back{display:none}

/* ---------- table ---------- */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}
.tsearch{position:relative;flex:1 1 220px;max-width:340px}
.tsearch input{width:100%;height:34px;border:1px solid var(--line);border-radius:9px;background:var(--paper);padding:0 10px 0 32px;outline:none}
.tsearch input:focus{border-color:var(--marigold)}
.tsearch .i{position:absolute;left:9px;top:8px;color:var(--ink-3)}
.sel{height:34px;border:1px solid var(--line);border-radius:9px;background:var(--card);padding:0 8px;font-size:13.5px;max-width:100%}
.twrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--card);position:sticky;top:0}
table.t th button{font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;display:inline-flex;gap:3px;align-items:center}
table.t td{padding:8px 12px;border-bottom:1px solid var(--line-2);white-space:nowrap}
table.t tbody tr{cursor:pointer}
table.t tbody tr:hover td{background:var(--hover)}
table.t tbody tr.on td{background:var(--sel)}
table.t .cb{width:36px;padding-right:0}
table.t input[type=checkbox]{width:16px;height:16px;accent-color:var(--marigold-ink);cursor:pointer}
.sname{display:flex;align-items:center;gap:10px;min-width:0}
.sname b{font-weight:600;display:block;line-height:1.2}
.sname small{color:var(--ink-3);font-size:12.5px}
.st{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.st i{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.st.active i{background:var(--ink)}
.st.awaiting{color:var(--marigold-ink)}.st.awaiting i{background:var(--marigold)}
.st.noregion{color:var(--vermilion)}.st.noregion i{background:var(--vermilion)}
.tfoot{display:flex;align-items:center;gap:10px;padding:10px 14px;font-size:13px;color:var(--ink-3);flex-wrap:wrap}
.tfoot .spacer{min-width:0}
.selbar{position:sticky;top:64px;z-index:5;display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--ink);color:var(--paper);border-radius:12px 12px 0 0;flex-wrap:wrap}
.selbar .btn{background:transparent;color:var(--paper);border-color:color-mix(in srgb,var(--paper) 30%,transparent)}
.selbar .btn.danger{background:var(--vermilion);border-color:var(--vermilion);color:#fff}
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{height:30px;padding:0 10px;border-radius:15px;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink-2);background:var(--card);white-space:nowrap}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.fchip .n{opacity:.65;margin-left:3px}

/* ---------- import ---------- */
.steps{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--ink-3);background:var(--card)}
.step i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);font-style:normal;font-size:12px}
.step.on{color:var(--ink);border-color:var(--marigold)}.step.on i{background:var(--marigold);color:var(--on-marigold)}
.step.done{color:var(--ink-2)}.step.done i{background:var(--ink);color:var(--paper)}
.drop{border:2px dashed var(--line);border-radius:14px;padding:18px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:stretch;background:var(--sunk);transition:border-color .15s,background .15s}
.drop.over{border-color:var(--marigold);background:var(--marigold-soft)}
.drop textarea{width:100%;min-height:210px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card);resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;outline:none}
.drop textarea:focus{border-color:var(--marigold)}
.drop-side{width:230px;display:flex;flex-direction:column;gap:10px;justify-content:center;align-items:flex-start;font-size:13.5px;color:var(--ink-2)}
.maptable{width:100%;border-collapse:collapse;font-size:14px}
.maptable td,.maptable th{padding:10px 12px;border-bottom:1px solid var(--line-2);text-align:left;vertical-align:middle}
.maptable th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600}
.maptable .samples{color:var(--ink-3);font-size:12.5px;max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sumtiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.sumtile{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card);text-align:left}
.sumtile b{display:block;font-size:26px;line-height:1.05}
.sumtile span{font-size:13px;color:var(--ink-2)}
.sumtile[aria-pressed="true"]{border-color:var(--marigold);box-shadow:0 0 0 3px var(--sel)}
.vs{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:1px 8px;border-radius:999px;white-space:nowrap}
.vs.new{background:var(--marigold-soft);color:var(--marigold-ink)}
.vs.exists{background:var(--indigo-soft);color:var(--indigo)}
.vs.invalid{background:var(--vermilion-soft);color:var(--vermilion)}
.vs.dup{background:var(--sunk);color:var(--ink-2);border:1px solid var(--line)}
.confirm-bar{display:flex;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.confirm-bar .spacer{min-width:0}

/* ---------- overlays ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(500px,100%);background:var(--card);border-left:1px solid var(--line);z-index:60;transform:translateX(102%);transition:transform .22s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:var(--shadow-pop)}
.drawer.on{transform:none}
.dr-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.dr-h h2{margin:0;font-size:17px;flex:1;min-width:0}
.dr-b{padding:18px;overflow:auto;flex:1}
.dr-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.field>span em{font-style:normal;color:var(--ink-3);font-weight:500}
.field input,.field select,.field textarea{width:100%;height:38px;border:1px solid var(--line);border-radius:9px;background:var(--paper);padding:0 12px;outline:none}
.field textarea{height:auto;min-height:90px;padding:10px 12px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--marigold);box-shadow:0 0 0 3px var(--sel)}
.field input:disabled,.field select:disabled{opacity:.75}
.field .err{display:block;color:var(--vermilion);font-size:12.5px;margin-top:4px;min-height:0}
.field .help{display:block;color:var(--ink-3);font-size:12.5px;margin-top:4px}
.field input[aria-invalid="true"]{border-color:var(--vermilion)}
.radios{display:flex;gap:6px;flex-wrap:wrap}
.radios label{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-size:14px;cursor:pointer}
.radios input{accent-color:var(--marigold-ink)}
.modal{position:fixed;left:50%;top:14vh;transform:translate(-50%,8px);width:min(520px,calc(100% - 32px));background:var(--card);border:1px solid var(--line);border-radius:16px;z-index:70;box-shadow:var(--shadow-pop);opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;max-height:76vh;display:flex;flex-direction:column}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
.modal .m-b{padding:20px;overflow:auto}
.modal h2{margin:0 0 6px;font-size:19px}
.modal .m-f{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.pal{position:fixed;left:50%;top:12vh;transform:translateX(-50%);width:min(620px,calc(100% - 24px));background:var(--card);border:1px solid var(--line);border-radius:16px;z-index:80;box-shadow:var(--shadow-pop);display:none;flex-direction:column;max-height:70vh;overflow:hidden}
.pal.on{display:flex}
.pal-in{display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line)}
.pal-in input{flex:1;height:54px;border:0;background:transparent;outline:none;font-size:17px;min-width:0}
.pal-list{overflow:auto;padding:6px}
.pal-g{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);padding:10px 10px 4px;font-weight:600}
.pal-i{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:9px;text-align:left;font-size:14.5px}
.pal-i small{margin-left:auto;color:var(--ink-3);font-size:12px;white-space:nowrap}
.pal-i[aria-selected="true"]{background:var(--sel)}
.pal-i .i{color:var(--ink-3)}
.pal-foot{display:flex;gap:12px;padding:8px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3);flex-wrap:wrap}
.menu{position:fixed;z-index:90;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-pop);padding:6px;min-width:230px;display:none}
.menu.on{display:block}
.menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:8px;font-size:14px}
.menu button:hover{background:var(--hover)}
.menu button small{display:block;color:var(--ink-3);font-size:12px}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.toasts{position:fixed;right:20px;bottom:20px;z-index:100;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{display:flex;gap:12px;align-items:center;background:var(--ink);color:var(--paper);padding:10px 12px 10px 14px;border-radius:12px;box-shadow:var(--shadow-pop);font-size:14px;max-width:calc(100vw - 32px);animation:tin .2s ease-out}
.toast button{color:var(--marigold);font-weight:700}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.help-grid{display:grid;grid-template-columns:1fr auto;gap:8px 16px;font-size:14px;align-items:center}

.list-page .row-item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 16px;border-top:1px solid var(--line-2);cursor:pointer}
.list-page .row-item:first-child{border-top:0}
.list-page .row-item:hover{background:var(--hover)}
.list-page .t{font-weight:600}
.list-page .m{font-size:13px;color:var(--ink-3);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pos{display:flex;gap:12px;align-items:center;padding:14px;cursor:pointer;text-align:left}
.pos:hover{border-color:var(--ink-3)}
.pos .ttl{font-size:12px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.pos b{display:block}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .c8,.c7,.c5,.c4{grid-column:span 12}
  .c3{grid-column:span 6}
  .rv{grid-template-columns:320px minmax(0,1fr)}
}
@media (max-width:760px){
  body{font-size:14.5px}
  .app{grid-template-columns:minmax(0,1fr);background:none}
  .side{display:none}
  .top{padding:10px 16px;gap:6px}
  .top .search{display:none}
  .top .act-label{display:none}
  .top .btn{padding:0;width:36px;justify-content:center}
  .top .scope-name{max-width:76px;overflow:hidden;text-overflow:ellipsis}
  .brand-sm{display:grid!important}
  .content{padding:16px 16px 96px}
  .phead h1{font-size:22px}
  .c3{grid-column:span 12}
  .hero-art{height:auto;background:none}
  .hero-art::before{bottom:auto;height:118px;background:url(../assets/banner.webp) 22% 60%/cover no-repeat}
  .hero-art::after{display:none}
  .hero-text{position:relative;max-width:none;margin-top:118px;padding:14px 16px 12px;left:auto;top:auto}
  .card-h{flex-wrap:wrap}
  .card-h .tabs{order:3;margin:6px 0 0!important}
  .pulse-t .pct .meter{display:none}
  .hero-text h1{font-size:24px;color:var(--ink)!important}
  .hero-text p{color:var(--ink-2)!important}
  .hero-text .eyebrow{color:var(--marigold-ink)!important}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi{border-bottom:1px solid var(--line);padding:12px 16px}
  .kpi:nth-child(2n){border-right:0}
  .kpi:nth-child(n+3){border-bottom:0}
  .kpi .num{font-size:25px}
  .rq{grid-template-columns:auto minmax(0,1fr)}
  .rq .acts{grid-column:2;justify-content:flex-start}
  .pulse-t .hide-sm{display:none}
  .rv{display:block}
  .rv-list{position:static;max-height:none}
  .rv .rv-detail{display:none}
  .rv.open .rv-list{display:none}
  .rv.open .rv-detail{display:block}
  .back{display:inline-flex}
  .rd{padding:16px}
  .who{grid-template-columns:1fr}
  .decide{margin:16px -16px -16px;padding:12px 16px;bottom:72px}
  .decide .hint{display:none}
  table.t .hide-sm{display:none}
  .sumtiles{grid-template-columns:1fr 1fr}
  .drop{grid-template-columns:1fr}
  .drop-side{width:auto}
  .selbar{top:58px}
  .toasts{left:16px;right:16px;bottom:84px;align-items:stretch}
  .bnav{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .bnav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--ink-3);padding:6px 0;border-radius:10px;position:relative}
  .bnav button[aria-current="page"]{color:var(--ink);background:var(--sel)}
  .bnav .badge{position:absolute;top:2px;left:calc(50% + 6px);margin:0;height:17px;min-width:17px;font-size:10.5px}
  .drawer{top:auto;height:92vh;border-radius:16px 16px 0 0;border-left:0;transform:translateY(102%)}
  .drawer.on{transform:none}
  .modal{top:auto;bottom:12px}
  .pal{top:8px}
}
.brand-sm{display:none;width:32px;height:32px;border-radius:9px;background:var(--marigold);color:var(--on-marigold);place-items:center;font-weight:700;font-size:14px;flex:none}
</style>

}

}

function canAct(r) {
  if (r.status !== 'pending' || r.by === me().id) return false;
  if (state.role === 'super') return true;
  const s = studentById(r.sid);
  return !needsSuper(r) && s && s.region === scope();
}
function waitingOn(r) {
  if (r.status !== 'pending' || canAct(r)) return '';
  if (r.by === me().id) return state.role === 'super' ? 'Needs another Super Admin' : 'Waiting on a Super Admin';
  return 'Waiting on a Super Admin';
}

function consequence(r) {

    case 'remove': return [`${first} loses Lounge access immediately. Their ${s.forms} form responses stay, anonymised. This cannot be undone after 24 hours.`, 'warn'];
  }
}

function requestDetail(r) {

    ...(s.history || []),

    <div class="rd-top"><div style="flex:1;min-width:220px"><div style="display:flex;gap:8px;align-items:center;margin-bottom:6px"><span class="kind ${r.kind}">${KIND[r.kind]}</span><span class="mono muted">${r.id}</span></div>

        ${s.id ? `<button class="btn sm ghost" data-student="${s.id}" style="margin:8px 0 0 -8px">Open profile${icon('right', 'sm')}</button>` : ''}</div>
      <div class="box"><div class="row">${avatarOf(a.self ? { name: a.name } : a)}<div style="min-width:0"><b>${esc(a.name)}</b><small>${a.self ? 'The student, via Lounge self-service' : esc(a.role) + (a.region ? ' · ' + rName(a.region) : '')}</small></div></div>

    <div class="decide">${footer}</div>

/* ---------- Students ---------- */
function filteredStudents() {
  const q = state.stQ.trim().toLowerCase();
  let list = scopedStudents();
  if (state.stStatus !== 'all') list = list.filter(s => statusOf(s) === state.stStatus);
  if (state.stRegion !== 'all' && !scope()) list = list.filter(s => (s.region || 'none') === state.stRegion);
  if (state.stJoined === 'week') list = list.filter(s => NOW - s.joined < 7 * D);
  if (state.stJoined === 'month') list = list.filter(s => NOW - s.joined < 30 * D);
  if (q) list = list.filter(s => s.name.toLowerCase().includes(q) || s.email.includes(q) || s.roll.includes(q));
  const [k, dir] = state.stSort;
  return list.slice().sort((a, b) => (k === 'name' ? a.name.localeCompare(b.name) : k === 'region' ? rName(a.region).localeCompare(rName(b.region)) : a[k] - b[k]) * dir);
}

function hl(t) {

function countLines(raw) { const n = raw.trim() ? raw.trim().split(/\r?\n/).length : 0; return n ? `${n} line${n > 1 ? 's' : ''} pasted` : 'Nothing pasted yet'; }
function parseGrid(raw) {
  const text = raw.replace(/\r\n?/g, '\n').trim();
  if (!text) return [];
  const delim = text.split('\n')[0].includes('\t') ? '\t' : (text.split('\n')[0].includes(';') && !text.split('\n')[0].includes(',') ? ';' : ',');
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; continue; }
    if (ch === '"' && cell === '') q = true;
    else if (ch === delim) { row.push(cell.trim()); cell = ''; }
    else if (ch === '\n') { row.push(cell.trim()); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  row.push(cell.trim()); rows.push(row);
  return rows.filter(r => r.some(c => c));
}
function guessMap(grid, header) {
  const cols = Math.max(...grid.map(r => r.length));
  const used = new Set();
  return [...Array(cols)].map((_, c) => {
    const h = header ? (grid[0][c] || '').toLowerCase() : '';
    const vals = grid.slice(header ? 1 : 0, 6).map(r => r[c] || '');
    let t = 'skip';
    if (/e-?mail/.test(h) || vals.some(v => v.includes('@'))) t = 'email';
    else if (/name/.test(h)) t = 'name';
    else if (/phone|mobile|whats/.test(h) || vals.every(v => !v || /^[+\d\s-]{8,}$/.test(v))) t = 'phone';
    else if (/gender|sex/.test(h)) t = 'gender';
    else if (/region|city|chapter/.test(h)) t = scope() ? 'skip' : 'region';
    if (used.has(t) && t !== 'skip') t = 'skip';
    used.add(t); return t;
  });
}
function looksHeader(row) { return row && !row.some(c => c.includes('@')) && row.some(c => /mail|name|phone|mobile|region|city|gender/i.test(c)); }
function validateImport() {
  const im = state.imp; const grid = parseGrid(im.raw);
  const body = im.header ? grid.slice(1) : grid;
  const byEmail = new Map(STUDENTS.map(s => [s.email, s]));
  const seen = new Map();
  im.rows = body.map((cells, i) => {
    const line = i + 1 + (im.header ? 1 : 0);
    const get = k => { const c = im.map.indexOf(k); return c >= 0 ? (cells[c] || '').trim() : ''; };
    const email = get('email').toLowerCase(), name = get('name'), regionRaw = scope() ? '' : get('region');
    let phone = get('phone').replace(/[\s-]/g, '').replace(/^\+?91/, '');
    const gRaw = get('gender').toLowerCase();
    const gender = /^f/.test(gRaw) ? 'Female' : /^m/.test(gRaw) ? 'Male' : gRaw ? 'Prefer not to say' : '';
    const r = { line, email, name, phone, gender, regionRaw, region: scope() || null, st: 'new', why: '' };
    const notes = [];
    if (!email) return { ...r, st: 'invalid', why: 'No email in this row' };
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return { ...r, st: 'invalid', why: 'Not an email address' };
    const dom = email.split('@')[1];
    if (!DOMAINS.includes(dom)) return { ...r, st: 'invalid', why: `@${dom} isn’t allowed — use a ds/es/mg/ae .study.iitm.ac.in address` };
    if (seen.has(email)) return { ...r, st: 'dup', why: `Same email as row ${seen.get(email)} — only the first is kept` };
    seen.set(email, line);
    const ex = byEmail.get(email);
    if (ex) return { ...r, st: 'exists', why: ex.region === scope() || !scope() ? `Already in ${rName(ex.region)} as ${ex.name}` : `Already in ${rName(ex.region)} — ask a Super Admin to move them` };
    if (!scope() && regionRaw) {
      const reg = DATA.regions.find(x => x.name.toLowerCase() === regionRaw.toLowerCase() || x.id === regionRaw.toLowerCase().replace(/\s+/g, ''));
      if (!reg) return { ...r, st: 'invalid', why: `Unknown region “${regionRaw}”` };
      r.region = reg.id;
    } else if (!scope()) notes.push('No region — assign later');
    if (phone && !/^\d{10}$/.test(phone)) { notes.push('Phone ignored (not 10 digits)'); r.phone = ''; }
    if (!name) notes.push('No name — they can add it on first sign-in');
    r.why = notes.join(' · ');
    return r;
  });
  im.tab = 'all';
}
function sampleSheet() {
  const reg = scope() ? ['Chennai'] : ['Chennai', 'Bengaluru', 'Delhi', 'Mumbai', 'Hyderabad', 'Kolkata', 'Pune', 'Lucknow', 'Patna'];
  const S = rng(99); const p = a => a[Math.floor(S() * a.length)];
  const names = ['Divya Natarajan', 'Rohan Gupta', 'Sneha Kulkarni', 'Arnab Saha', 'Keerthana Murugan', 'Vivek Pandey', 'Ritika Arora', 'Pranav Iyer', 'Ishani Bose', 'Gokul Selvam', 'Simran Kaur', 'Hari Prasad', 'Tanushree Das', 'Yash Shah', 'Meera Pillai', 'Ankit Jha', 'Kavya Shetty', 'Saurabh Verma', 'Janani Balaji', 'Aman Sinha'];
  const lines = ['Full name\tEmail ID\tMobile\tGender' + (scope() ? '' : '\tCity / Region')];
  const existing = scopedStudents().slice(5, 9);
  for (let i = 0; i < 45; i++) {
    let name = p(names), email = `25f${p(['1', '1', '2'])}00${String(5000 + Math.floor(S() * 4000))}@${S() < .9 ? DOMAINS[0] : DOMAINS[1]}`, phone = '9' + String(Math.floor(S() * 1e9)).padStart(9, '0'), g = p(['F', 'M', 'Male', 'Female', '']), region = p(reg);
    if (i === 4) email = email.replace(/@.*/, '@gmail.com');
    if (i === 11) email = email.replace(/@.*/, '@iitm.ac.in');
    if (i === 19) email = email.replace(/@.*/, '@study.iitm.ac.in');
    if (i === 23) email = 'sneha.k at ds.study.iitm.ac.in';
    if (i === 28) email = '';
    if (i === 15 || i === 33) { const e = existing[i === 15 ? 0 : 1]; email = e.email.toUpperCase(); name = e.name; }
    if (i === 38) { email = existing[2].email; name = existing[2].name; }
    if (i === 21) { const prev = lines[8].split('\t'); name = prev[0]; email = prev[1]; }

    if (i === 9 || i === 26) phone = '';
    lines.push([name, email, phone, g, ...(scope() ? [] : [region])].join('\t'));

  return lines.join('\n');
}

function applyChange(r, undo) {

  if (stq) stq.oninput = debounce(() => { state.stQ = stq.value; state.stPage = 0; const pos = stq.selectionStart; render(); const n = $('#stq'); n.focus(); n.setSelectionRange(pos, pos); }, 120);
  $('#stRegion') && ($('#stRegion').onchange = e => { state.stRegion = e.target.value; state.stPage = 0; render(); });
  $('#stJoined') && ($('#stJoined').onchange = e => { state.stJoined = e.target.value; state.stPage = 0; render(); });
  $('#actFilter') && ($('#actFilter').onchange = e => { state.actFilter = e.target.value; render(); });
  $('#selPage') && ($('#selPage').onchange = e => { const list = filteredStudents().slice(state.stPage * 25, state.stPage * 25 + 25); list.forEach(s => e.target.checked ? state.sel.add(s.id) : state.sel.delete(s.id)); render(); });
  const raw = $('#impRaw');
  if (raw) {
    raw.oninput = () => { state.imp.raw = raw.value; $('#impCount').textContent = countLines(raw.value); document.querySelector('[data-act="imp-parse"]').disabled = !raw.value.trim(); };
    const drop = $('#drop');
    ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
    ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
    drop.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) readFile(f); });
    $('#impFile').onchange = e => { const f = e.target.files[0]; if (f) readFile(f); };
  }
  $('#impHeader') && ($('#impHeader').onchange = e => { state.imp.header = e.target.checked; state.imp.map = guessMap(parseGrid(state.imp.raw), state.imp.header); render(); });
  document.querySelectorAll('[data-map]').forEach(s => s.onchange = () => { state.imp.map[+s.dataset.map] = s.value; render(); });
  const dn = $('#declineNote');
  if (dn) { dn.focus(); dn.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); decide(state.reqSel, 'declined', dn.value.trim()); } if (e.key === 'Escape') { e.stopPropagation(); state.declining = false; render(); } }; }
}
function readFile(f) {
  if (f.size > 2e6) return toast('That file is over 2 MB — split it and try again.');
  const fr = new FileReader();
  fr.onload = () => { state.imp.raw = String(fr.result); state.imp.fileName = f.name; render(); };
  fr.readAsText(f);
}
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
function download(name, text) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv' })); a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
const csvCell = v => /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : String(v ?? '');

document.addEventListener('click', e => {
  const t = e.target.closest('button, a, [data-req], [data-student], [data-event], [data-region], [data-notice], [data-form], tr[data-student], .pal-i, [data-person]');
  if (!t) { if (!e.target.closest('#menu')) closeMenu(); if (!e.target.closest('#searchWrap')) $('#suggest').classList.remove('on'); return; }
  if (t.matches('#scrim')) return;
  const d = t.dataset;
  if (t.tagName === 'A' && t.getAttribute('href') === '#') e.preventDefault();
  if (!t.closest('#menu') && !d.menu && d.act !== 'profile' && d.act !== 'more') closeMenu();
  if (!e.target.closest('#searchWrap')) $('#suggest').classList.remove('on');

  const pk = e.target.closest('[data-pick]')?.dataset.pick;
  if (pk) { state.sel.has(pk) ? state.sel.delete(pk) : state.sel.add(pk); render(); return; }
  if (e.target.matches('input[type=checkbox]')) return;
  if (d.pal !== undefined) return palRun(+d.pal);
  if (d.close !== undefined) return closeOverlays();
  if (d.menu) { $('#menu').classList.contains('on') && $('#menu').dataset.for === d.menu ? closeMenu() : (openMenu(t, MENUS[d.menu]()), $('#menu').dataset.for = d.menu); return; }
  if (d.role) return setRole(d.role);
  if (d.go) { closeOverlays(); if (d.go === 'import' && state.imp.step === 4) state.imp = { step: 1, raw: '', fileName: '', header: true, map: [], rows: [], tab: 'all', result: null }; return go(d.go, d.go === 'requests' ? { reqOpen: false } : {}); }
  if (d.create) { closeMenu(); return createDrawer(d.create); }
  if (d.approve) { e.stopPropagation(); return decide(d.approve, 'approved'); }
  if (d.decline) { e.stopPropagation(); return go('requests', { reqTab: 'mine', reqSel: d.decline, reqOpen: true, declining: true, keepScroll: state.view === 'requests' }); }
  if (d.declineConfirm) return decide(d.declineConfirm, 'declined', ($('#declineNote')?.value || '').trim());
  if (d.declineCancel !== undefined) { state.declining = false; return render(); }
  if (d.ovtab) { state.ovTab = d.ovtab; return render(); }
  if (d.reqtab) { state.reqTab = d.reqtab; state.reqSel = null; state.declining = false; return render(); }
  if (d.reqsel) { state.reqSel = d.reqsel; state.reqOpen = true; state.declining = false; render(); if (matchMedia('(max-width:760px)').matches) scrollTo({ top: 0 }); return; }
  if (d.reqback !== undefined) { state.reqOpen = false; return render(); }
  if (d.req) { closeOverlays(); const r = REQUESTS.find(x => x.id === d.req); return go('requests', { reqTab: r.status !== 'pending' ? 'decided' : canAct(r) ? 'mine' : 'waiting', reqSel: d.req, reqOpen: true, declining: false }); }
  if (d.student) return studentDrawer(d.student);
  if (d.event) return eventDrawer(d.event);
  if (d.region) return regionDrawer(d.region);
  if (d.regionStudents) { closeOverlays(); return go('students', { stRegion: d.regionStudents, stStatus: 'all', stPage: 0, stQ: '', stJoined: 'any' }); }
  if (d.notice) return noticeDrawer(d.notice);
  if (d.form) return formDrawer(d.form);
  if (d.person) { const u = DATA.users[d.person]; return toast(`Message to ${esc(u.name)} opens in WhatsApp (stub)`); }
  if (d.studentsJoined) return go('students', { stJoined: d.studentsJoined, stStatus: 'all', stPage: 0, stQ: '', stRegion: 'all', stSort: ['joined', -1] });
  if (d.studentsStatus) return go('students', { stStatus: d.studentsStatus, stJoined: 'any', stPage: 0, stQ: '', stRegion: 'all' });
  if (d.ststatus) { state.stStatus = d.ststatus; state.stPage = 0; return render(); }
  if (d.sort) { state.stSort = state.stSort[0] === d.sort ? [d.sort, -state.stSort[1]] : [d.sort, d.sort === 'joined' ? -1 : 1]; return render(); }
  if (d.page) { state.stPage += +d.page; render(); return document.querySelector('.toolbar')?.scrollIntoView({ block: 'nearest' }); }
  if (d.impstep) { state.imp.step = +d.impstep; return render(); }
  if (d.imptab) { state.imp.tab = state.imp.tab === d.imptab ? 'all' : d.imptab; return render(); }
  if (d.suggest) { $('#suggest').classList.remove('on'); $('#search').value = ''; return studentDrawer(d.suggest); }

  const im = state.imp;
  switch (d.act) {
    case 'palette': return openPalette();
    case 'theme': return toggleTheme();
    case 'help': closeMenu(); return showHelp();
    case 'profile': return $('#menu').classList.contains('on') && $('#menu').dataset.for === 'profile' ? closeMenu() : (openMenu(t, MENUS.profile()), $('#menu').dataset.for = 'profile');
    case 'more': return $('#menu').classList.contains('on') && $('#menu').dataset.for === 'more' ? closeMenu() : (openMenu(t, MENUS.more()), $('#menu').dataset.for = 'more');
    case 'add-student': closeMenu(); return addStudentDrawer();
    case 'save-student': return saveStudent();
    case 'save-create': return saveCreate(d.kind);
    case 'remove-one': closeOverlays(); return removeFlow([d.id]);
    case 'remove-sel': return removeFlow([...state.sel]);
    case 'confirm-remove': return confirmRemove(d.ids.split(','));
    case 'clear-sel': state.sel.clear(); return render();
    case 'reset-filters': Object.assign(state, { stQ: '', stStatus: 'all', stRegion: 'all', stJoined: 'any', stPage: 0 }); return render();
    case 'copy-emails': { const em = [...state.sel].map(studentById).filter(Boolean).map(s => s.email).join(', '); navigator.clipboard?.writeText(em).catch(() => { }); return toast(`Copied ${state.sel.size} emails`); }
    case 'copy': navigator.clipboard?.writeText(d.text).catch(() => { }); return toast('Email copied');
    case 'export': { const rows = [...state.sel].map(studentById).filter(Boolean); download('students.csv', ['name,email,roll,region,status,joined', ...rows.map(s => [s.name, s.email, s.roll, rName(s.region), STATUS_LABEL[statusOf(s)], new Date(s.joined).toISOString().slice(0, 10)].map(csvCell).join(','))].join('\n')); return toast(`Exported ${rows.length} rows`); }
    case 'export-audit': download('activity.csv', ['when,who,what', ...AUDIT.map(a => [new Date(a.at).toISOString(), DATA.users[a.actor]?.name, a.text.replace(/<[^>]+>/g, '')].map(csvCell).join(','))].join('\n')); return toast('Activity exported');
    case 'remind': { const n = scopedStudents().filter(s => s.region && !s.signedIn).length; return toast(`Sign-in nudge queued for ${fmt(n)} students · goes out at 6 pm`); }
    case 'remind-one': return toast('Nudge sent');
    case 'withdraw': { const r = REQUESTS.find(x => x.id === d.id); REQUESTS.splice(REQUESTS.indexOf(r), 1); AUDIT.unshift({ at: NOW - 100, actor: me().id, text: `withdrew request <b>${r.id}</b>`, region: studentById(r.sid)?.region }); state.reqSel = null; render(); return toast(`Withdrew ${r.id}`, () => { REQUESTS.unshift(r); AUDIT.shift(); state.reqSel = r.id; render(); }); }
    case 'nudge': return toast('Super Admins nudged on WhatsApp (stub)');
    case 'stub': return toast(d.msg || 'Stubbed in this prototype');
    case 'imp-sample': im.raw = sampleSheet(); im.fileName = 'Sundarbans new joiners — Oct.xlsx (pasted)'; return render();
    case 'imp-parse': { const g = parseGrid(im.raw); if (!g.length) return; im.header = looksHeader(g[0]); im.map = guessMap(g, im.header); im.step = 2; return render(); }
    case 'imp-validate': validateImport(); im.step = 3; return render();
    case 'imp-commit': {
      const add = im.rows.filter(r => r.st === 'new');
      add.forEach(r => { const roll = r.email.split('@')[0]; const s = mkStudent(r.region, { name: r.name || roll, roll, domain: r.email.split('@')[1], joined: NOW - MIN, signedIn: false, phone: r.phone, gender: r.gender }); s.email = r.email; });
      const c = k => im.rows.filter(r => r.st === k).length;
      im.result = { added: add.length, exists: c('exists'), invalid: c('invalid'), dup: c('dup'), errors: im.rows.filter(r => r.st !== 'new') };
      AUDIT.unshift({ at: NOW - 60 * 1000, actor: me().id, text: `added <b>${add.length}</b> students${scope() ? ' to Chennai' : ''} from a sheet import`, region: scope() });
      im.step = 4; render(); return toast(`${add.length} students added`);
    }
    case 'imp-errors': { const L = { exists: 'Already there', invalid: 'Invalid', dup: 'Duplicate in file' }; download('import-skipped-rows.csv', ['row,email,name,result,reason', ...im.result.errors.map(r => [r.line, r.email, r.name, L[r.st], r.why].map(csvCell).join(','))].join('\n')); return toast('Downloaded import-skipped-rows.csv'); }
    case 'imp-reset': state.imp = { step: 1, raw: '', fileName: '', header: true, map: [], rows: [], tab: 'all', result: null }; return render();
  }
});
$('#scrim').addEventListener('click', closeOverlays);

/* top search with suggestions */
const search = $('#search'); let sugIdx = 0;
search.addEventListener('input', () => {
  const q = search.value.trim().toLowerCase(); const box = $('#suggest');
  if (q.length < 2) { box.classList.remove('on'); return; }
  const m = scopedStudents().filter(s => s.name.toLowerCase().includes(q) || s.email.includes(q) || s.roll.includes(q)).slice(0, 6);
  sugIdx = 0;
  box.innerHTML = (m.map((s, i) => `<button data-suggest="${s.id}" class="${i === 0 ? 'hi' : ''}">${emblem(s.region, 'sm')}<span><b style="font-weight:600">${esc(s.name)}</b> <span class="muted mono">${esc(s.roll)}</span></span><small>${rName(s.region)}</small></button>`).join('') || `<div class="muted" style="padding:8px 10px;font-size:13.5px">No one ${scope() ? 'in Chennai ' : ''}matches “${esc(q)}”.</div>`) + `<button data-go="students" id="sugAll">${icon('search', 'sm')}<span>See all results in Students</span><small>Enter</small></button>`;
  box.classList.add('on');
});
search.addEventListener('keydown', e => {
  const btns = [...document.querySelectorAll('#suggest [data-suggest]')];
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); if (!btns.length) return; sugIdx = (sugIdx + (e.key === 'ArrowDown' ? 1 : -1) + btns.length) % btns.length; btns.forEach((b, i) => b.classList.toggle('hi', i === sugIdx)); }
  if (e.key === 'Enter') { e.preventDefault(); const q = search.value.trim(); if (e.altKey || !btns.length) { go('students', { stQ: q, stPage: 0, stStatus: 'all', stRegion: 'all', stJoined: 'any' }); } else { studentDrawer(btns[sugIdx].dataset.suggest); } $('#suggest').classList.remove('on'); search.value = ''; search.blur(); }
  if (e.key === 'Escape') { $('#suggest').classList.remove('on'); search.blur(); }
});
document.addEventListener('click', e => { if (e.target.id === 'sugAll' || e.target.closest('#sugAll')) { const q = search.value.trim(); search.value = ''; go('students', { stQ: q, stPage: 0, stStatus: 'all', stRegion: 'all', stJoined: 'any' }); } }, true);

$('#palInput').addEventListener('input', renderPalette);
$('#palInput').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { e.preventDefault(); palMove(1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); palMove(-1); }
  else if (e.key === 'Enter') { e.preventDefault(); palRun(palIdx); }
  else if (e.key === 'Escape') { e.preventDefault(); closePalette(); $('#scrim').classList.remove('on'); }
});

let gPending = false;
document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if ((e.metaKey || e.ctrlKey) && k === 'k') { e.preventDefault(); return $('#pal').classList.contains('on') ? (closePalette(), $('#scrim').classList.remove('on')) : openPalette(); }
  if (e.key === 'Escape') { if ($('#pal').classList.contains('on') || $('#drawer').classList.contains('on') || $('#modal').classList.contains('on') || $('#menu').classList.contains('on')) return closeOverlays(); if (state.declining) { state.declining = false; return render(); } return; }
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName) || document.activeElement?.isContentEditable;
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if ($('#pal').classList.contains('on') || $('#modal').classList.contains('on')) return;
  if (e.key === '?') { e.preventDefault(); return showHelp(); }
  if (e.key === '/') { e.preventDefault(); return matchMedia('(max-width:760px)').matches ? openPalette() : search.focus(); }
  if (gPending) { gPending = false; const map = { o: 'overview', r: 'requests', s: 'students', e: 'events', a: 'activity' }; if (map[k]) { e.preventDefault(); return go(map[k]); } }
  if (k === 'g') { gPending = true; setTimeout(() => gPending = false, 900); return; }
  if ((e.key === 'Enter' || e.key === ' ') && document.activeElement?.matches('[data-req],[data-event],[data-region],[data-notice],[data-form],.rq')) { e.preventDefault(); document.activeElement.click(); return; }
  if (state.view !== 'requests' || $('#drawer').classList.contains('on')) return;
  const lists = { mine: mine(), waiting: waiting(), decided: decided() };
  const list = lists[state.reqTab]; const i = list.findIndex(r => r.id === state.reqSel);
  if (k === 'j' || k === 'k') {
    e.preventDefault(); if (!list.length) return;
    const n = list[Math.max(0, Math.min(list.length - 1, i + (k === 'j' ? 1 : -1)))];
    state.reqSel = n.id; state.declining = false; render();
    document.querySelector(`[data-reqsel="${n.id}"]`)?.scrollIntoView({ block: 'nearest' });
  }
  if (k === 'a' && state.reqSel) { e.preventDefault(); const r = REQUESTS.find(x => x.id === state.reqSel); if (r && canAct(r)) decide(r.id, 'approved'); else toast(r && r.by === me().id ? 'You can’t approve your own request' : 'This one needs a Super Admin'); }
  if (k === 'r' && state.reqSel) { e.preventDefault(); const r = REQUESTS.find(x => x.id === state.reqSel); if (r && canAct(r)) { state.declining = true; render(); } }
});
addEventListener('resize', debounce(renderShell, 150));

render();
</script>
</body>
</html>
