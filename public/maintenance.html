<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f7f2e8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#15120e" media="(prefers-color-scheme: dark)" />
    <title>Sundarbans House | Being mended</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anek+Latin:wdth,wght@75..125,300..800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Maintenance page. Served in place of the whole site by middleware.js, so it stands alone:
       * no scripts, no bundle, one image. Colours mirror src/assets/tokens.css. Motion is one-shot
       * (the unroll, the brushed title, the stamp, one blink) plus a slow lantern glow. Transform
       * and opacity only, and all of it stops under reduced motion. */
      :root {
        color-scheme: light;
        --paper: #f7f2e8;
        --card: #fffcf6;
        --ink: #1d1915;
        --ink-2: #5e5449;
        --line: #e0d5c3;
        --mari: #f2a93b;
        --mari-ink: #8f4a00;
        --shadow: 0 1px 0 rgb(29 25 21 / 0.04), 0 12px 32px -18px rgb(29 25 21 / 0.28);
        --font: 'Anek Latin', ui-sans-serif, system-ui, sans-serif;
        --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
        --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          color-scheme: dark;
          --paper: #15120e;
          --card: #1f1a15;
          --ink: #f3ebdd;
          --ink-2: #b9ac9a;
          --line: #2e271f;
          --mari: #f4b04a;
          --mari-ink: #f6bb5e;
          --shadow: 0 1px 0 rgb(0 0 0 / 0.3), 0 16px 40px -20px rgb(0 0 0 / 0.7);
        }
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html {
        background: var(--paper);
        color: var(--ink);
        font-family: var(--font);
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        background: var(--paper);
        overflow-x: hidden;
      }

      .stage {
        min-height: 100svh;
        display: grid;
        align-content: center;
        justify-items: center;
        gap: 22px;
        padding: 28px 16px 40px;
        max-width: 560px;
        margin: 0 auto;
        text-align: center;
      }

      .masthead {
        display: grid;
        justify-items: center;
        gap: 10px;
      }
      .crest {
        display: block;
        width: 72px;
        height: 72px;
        animation: fade-up 0.8s var(--ease-out) 0.1s both;
      }
      .brand {
        margin: 0;
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink-2);
      }

      /* The pat: a painted plate between two marigold rods. The plate unrolls top-down. */
      .scroll {
        margin: 0;
        width: min(100%, 380px);
        display: grid;
        gap: 0;
      }
      .rod {
        height: 12px;
        border-radius: 99px;
        background: var(--mari-ink);
        box-shadow: var(--shadow);
        transform-origin: center;
        animation: rod-in 0.6s var(--ease-out) both;
      }
      .rod.bottom {
        animation-delay: 1.2s;
      }
      .plate {
        position: relative;
        margin: 0 6px;
        background: var(--card);
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
        overflow: hidden;
        clip-path: inset(0 0 0 0);
        animation: unroll 1.4s var(--ease-out) 0.3s both;
      }
      .plate img {
        display: block;
        width: 100%;
        height: auto;
      }

      /* Lantern glow. Position is the lantern in the plate (1122×1402 source, 4:5). */
      .lamp {
        position: absolute;
        left: 30.3%;
        top: 62.8%;
        width: 16%;
        aspect-ratio: 1;
        translate: -50% -50%;
        border-radius: 50%;
        background: radial-gradient(
          closest-side,
          color-mix(in srgb, var(--mari) 70%, transparent),
          transparent
        );
        mix-blend-mode: screen;
        pointer-events: none;
        animation: breathe 3.6s ease-in-out 1.8s infinite alternate;
      }

      /* One blink from the tiger's eye under the cloth, once, after the plate has unrolled. */
      .lid {
        position: absolute;
        left: 90.2%;
        top: 62.3%;
        width: 3.6%;
        height: 2.2%;
        translate: -50% -50%;
        border-radius: 50%;
        background: var(--ink);
        transform: scaleY(0);
        pointer-events: none;
        animation: blink 0.5s var(--ease-out) 3.6s both;
      }

      .copy {
        display: grid;
        gap: 14px;
        justify-items: center;
      }
      h1 {
        margin: 0;
        font-size: clamp(34px, 4.4vw, 48px);
        font-weight: 750;
        letter-spacing: -0.04em;
        line-height: 0.95;
      }
      /* The title is brushed on from the left. */
      .brush {
        display: inline-block;
        clip-path: inset(0 100% 0 0);
        animation: brush-on 1.3s var(--ease-out) 2s both;
      }
      .lede {
        margin: 0;
        max-width: 42ch;
        font-size: 15px;
        line-height: 1.5;
        color: var(--ink-2);
        opacity: 0;
        animation: fade-up 0.6s var(--ease-out) 3.2s both;
      }

      /* A rubber stamp for the date. */
      .stamp {
        margin: 4px 0 0;
        display: inline-flex;
        align-items: baseline;
        gap: 10px;
        padding: 8px 16px;
        border: 2px solid var(--mari-ink);
        border-radius: 6px;
        color: var(--mari-ink);
        transform: rotate(-2deg);
        font-variant-numeric: tabular-nums;
        animation: stamp 0.55s var(--ease-spring) 3.8s both;
      }
      .stamp span {
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .stamp strong {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      @keyframes rod-in {
        from {
          transform: scaleX(0.2);
          opacity: 0;
        }
        to {
          transform: none;
          opacity: 1;
        }
      }
      @keyframes unroll {
        from {
          clip-path: inset(0 0 100% 0);
        }
        to {
          clip-path: inset(0 0 0 0);
        }
      }
      @keyframes brush-on {
        to {
          clip-path: inset(0 0 0 0);
        }
      }
      @keyframes fade-up {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes stamp {
        from {
          opacity: 0;
          transform: rotate(-2deg) scale(1.35);
        }
        to {
          opacity: 1;
          transform: rotate(-2deg) scale(1);
        }
      }
      @keyframes breathe {
        from {
          opacity: 0.35;
          scale: 0.92;
        }
        to {
          opacity: 0.8;
          scale: 1.06;
        }
      }
      @keyframes blink {
        0%,
        100% {
          transform: scaleY(0);
        }
        50% {
          transform: scaleY(1);
        }
      }

      /* Wide screens: the plate on the left, the words on the right. */
      @media (min-width: 860px) {
        .stage {
          grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
          max-width: 1080px;
          gap: 56px;
          align-items: center;
          justify-items: stretch;
          padding: 40px 40px;
        }
        .masthead {
          grid-column: 1 / -1;
          justify-self: center;
        }
        .crest {
          width: 88px;
          height: 88px;
        }
        .scroll {
          width: min(100%, 520px);
          justify-self: end;
        }
        .copy {
          justify-items: start;
          text-align: left;
        }
        .lede {
          margin: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
        }
        .plate {
          clip-path: none;
        }
        .brush {
          clip-path: none;
        }
        .lede {
          opacity: 1;
        }
        .lid {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <header class="masthead">
        <img
          class="crest"
          src="/maintenance/crest.webp"
          width="256"
          height="256"
          alt="Sundarbans House crest"
        />
        <p class="brand">Sundarbans House · IIT Madras BS</p>
      </header>

      <figure class="scroll">
        <div class="rod top" aria-hidden="true"></div>
        <div class="plate">
          <img
            src="/maintenance/patua.webp"
            width="900"
            height="1125"
            alt="A painter at work in a boat beside the mangroves at sunset."
          />
          <span class="lamp" aria-hidden="true"></span>
          <span class="lid" aria-hidden="true"></span>
        </div>
        <div class="rod bottom" aria-hidden="true"></div>
      </figure>

      <section class="copy" aria-labelledby="maintenance-title">
        <h1 id="maintenance-title"><span class="brush">The website is being mended.</span></h1>
        <p class="lede">
          Fresh paint, a few new rooms, and some careful strokes. Something worth the wait.
        </p>
        <p class="stamp">
          <span>Reopens</span>
          <strong>17 October 2026</strong>
        </p>
      </section>
    </main>
  </body>
</html>
