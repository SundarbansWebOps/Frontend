name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per PR: a new push cancels the stale run so the latest status is the one shown.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prettier check
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            RANGE="${PR_BASE}...${HEAD_SHA}"
          elif [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && [ -n "$BEFORE_SHA" ]; then
            RANGE="${BEFORE_SHA}..${HEAD_SHA}"
          else
            RANGE="HEAD^..HEAD"
          fi

          npm run format:check -- --range "$RANGE"

      - name: ESLint
        run: npm run lint

      - name: Study data check
        run: npm run check:study

      - name: Design check
        run: npm run check:design

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Route smoke tests
        run: npm run test:smoke

      - name: Screenshots and phone overflow check
        run: npm run shots

      - name: Upload screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: test-results/shots/
          if-no-files-found: ignore
