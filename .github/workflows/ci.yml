name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prettier check
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: Study data check
        run: npm run check:study

      - name: Design check
        run: npm run check:design

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Route smoke tests
        run: npm run test:smoke

      - name: Screenshots and phone overflow check
        run: npm run shots

      - name: Upload screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: test-results/shots/
          if-no-files-found: ignore

  # Team PRs may change only the course data files; the maintainers listed here are exempt.
  # Keeps an AI-assisted data PR from touching code, config or this workflow.
  contributor-scope:
    if: github.event_name == 'pull_request' && !contains(fromJSON('["Anuraj-dev"]'), github.event.pull_request.user.login)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Only src/data/study/courses/ changed
        run: |
          outside=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- . ':!src/data/study/courses/')
          if [ -n "$outside" ]; then
            echo "::error::This PR may only change files in src/data/study/courses/. Undo these changes:"
            echo "$outside"
            exit 1
          fi
          echo "Scope OK: only course data changed."
